# 互聯 fanout 小規模範例拓樸（互聯設計 §9）—— 由 examples/gen_interconnect.py 產生。
#
# 請勿手動編輯；如需調整，改 gen_interconnect.py 後重跑：
#     python examples/gen_interconnect.py
