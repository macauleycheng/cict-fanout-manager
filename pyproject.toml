[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-manager"
version = "0.1.0"
description = "拓樸管理 CLI 工具（Topology Manager）Phase 1 骨架"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.5,<2.11",
    # 3.2+ 需 Python>=3.9，3.8 僅能用到 3.1
    "networkx>=3.1,<3.2",
    "PyYAML",
    # Phase 3：FastAPI REST 介接（設計 §2.1；0.110.x 為支援 Python 3.8 的末批）
    "fastapi>=0.110,<0.111",
    # uvicorn production ASGI 入口（0.23~0.33 相容 Python 3.8）
    "uvicorn>=0.23,<0.34",
]

[project.optional-dependencies]
# httpx：Starlette TestClient 依賴（Phase 3 測試用，設計 §2.1）
dev = ["pytest", "httpx"]
# Phase 4 fanout SSH 下發層（選用相依；netmiko 僅於 driver 連線時延遲 import，
# 純邏輯/設定/CLI 路徑不需安裝，設計 §2）
drivers = ["netmiko>=4.1,<4.5"]

[project.scripts]
topo-manager = "topo_manager.cli:main"
topo-manager-api = "topo_manager.api.server:run"

[tool.setuptools.packages.find]
where = ["src"]

# Web UI 靜態資產隨 wheel/sdist 出貨（設計 §1.5）：package-data 預設不含非 .py
# 檔，顯式列出 api/static/* 讓非 editable 安裝也找得到 index.html/app.css/app.js。
[tool.setuptools.package-data]
"topo_manager.api" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
# live marker 標記需真實設備的測試；預設 addopts 以 '-m not live' 排除收集，
# 避免無設備環境誤跑（設計 §11.2）。
markers = [
    "live: 需真實設備（預設 skip）",
]
addopts = "-m 'not live'"
